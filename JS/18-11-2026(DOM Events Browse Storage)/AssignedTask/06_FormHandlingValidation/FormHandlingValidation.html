<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Handling and Validation</title>
</head>
<body>
    <h1>Employee Registration Form</h1>
    <form id="RegistrationForm" novalidate>
        <p>
            <label for="Name">Full Name:</label>
            <input type="text" id="Name" placeholder="Enter full name">
        </p>
        <p>
            <label for="Email">Email:</label>
            <input type="email" id="Email" placeholder="Enter email">
        </p>
        <p>
            <label for="Phone">Phone:</label>
            <input type="tel" id="Phone" placeholder="10-digit phone number">
        </p>
        <p>
            <label for="Password">Password:</label>
            <input type="password" id="Password" placeholder="Minimum 8 characters">
        </p>
        <button type="submit">Register</button>
    </form>
    <pre id="Output"></pre>
    <script src="FormHandlingValidation.js"></script>
</body>
</html>
