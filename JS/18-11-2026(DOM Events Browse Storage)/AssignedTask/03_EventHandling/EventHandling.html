<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Handling</title>
</head>
<body>
    <h1>JavaScript Event Handling</h1>
    <button id="ClickButton">Click Event</button>
    <input type="text" id="NameInput" placeholder="Type your name">
    <select id="DepartmentSelect">
        <option value="">Select Department</option>
        <option value="Frontend">Frontend</option>
        <option value="Backend">Backend</option>
        <option value="Testing">Testing</option>
    </select>
    <form id="DemoForm">
        <input type="text" id="FormName" placeholder="Enter name" required>
        <button type="submit">Submit Form</button>
    </form>
    <div id="MouseArea" style="padding:25px;background:#dbeafe;margin:15px 0;">
        Move your mouse over this area.
    </div>
    <pre id="Output">Event output appears here...</pre>
    <script src="EventHandling.js"></script>
</body>
</html>
