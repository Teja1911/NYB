<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task and Employee Manager</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h1>Task and Employee Management</h1>
    <section>
        <input id="employeeName" placeholder="Employee name">
        <input id="employeeRole" placeholder="Employee role">
        <button id="addEmployee">Add Employee</button>
    </section>
    <section>
        <h2>Add Task</h2>
        <input id="taskTitle" placeholder="Task title">
        <select id="employeeSelect">
            <option value="">Employee Select</option>
        </select>
        <button id="addTask">Add Task</button>
    </section>
    <section>
        <h2>Task Dashboard</h2>
        <input id="search" placeholder="Search employee or task">
        <select id="taskFilter">
            <option value="all">All Tasks</option>
            <option value="pending">Pending</option>
            <option value="completed">Completed</option>
        </select>
        <button id="loadEmployees">Load Sample Employees</button>
        <p id="message"></p>
        <div id="summary"></div>
        <ul id="taskList"></ul>
    </section>
    <script type="module" src="./js/app.js"></script>
</body>
</html>
