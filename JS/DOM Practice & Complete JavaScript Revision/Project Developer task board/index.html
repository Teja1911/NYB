<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Developer Task Board</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Developer Task Board</h1>

    <p id="loadingMessage"></p>

    <p id="errorMessage"></p>

    <form id="taskForm">

        <input
            id="taskInput"
            type="text"
            placeholder="Enter task"
        >

        <select id="developerSelect">
            <option value="">
                Select Developer
            </option>
        </select>

        <button type="submit">
            Add Task
        </button>

    </form>

    <h2>Tasks</h2>

    <div id="taskContainer"></div>

    <script src="./index.js"></script>

</body>

</html>
