<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>API Product Management</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./css/product-management.css">
</head>
<body>
    <header class="page-header">
        <div>
            <h1>Product Management</h1>
            <p>Practice REST APIs, Async/Await and JavaScript Modules</p>
        </div>

        <button id="refreshButton" type="button">Refresh Products</button>
    </header>

    <main class="container">
        <section class="panel">
            <h2 id="formHeading">Add Product</h2>

            <form id="productForm">
                <label for="productTitle">Product Name</label>
                <input id="productTitle" name="title" type="text" required maxlength="100">

                <label for="productPrice">Price</label>
                <input id="productPrice" name="price" type="number"
                       min="0.01" step="0.01" required>

                <label for="productCategory">Category</label>
                <select id="productCategory" name="category" required>
                    <option value="">Select a category</option>
                    <option value="electronics">Electronics</option>
                    <option value="jewelery">Jewelry</option>
                    <option value="men's clothing">Men's Clothing</option>
                    <option value="women's clothing">Women's Clothing</option>
                </select>

                <label for="productDescription">Description</label>
                <textarea id="productDescription" name="description"
                          rows="3" required maxlength="500"></textarea>

                <label for="productImage">Image URL</label>
                <input id="productImage" name="image" type="url" required
                       value="https://fakestoreapi.com/img/81fPKd-2AYL._AC_SL1500_.jpg">

                <p id="formMessage" class="message" role="status"></p>

                <div class="form-actions">
                    <button id="submitButton" type="submit">Add Product</button>
                    <button id="cancelEditButton" type="button" hidden>
                        Cancel Edit
                    </button>
                </div>
            </form>
        </section>

        <section class="panel">
            <div class="toolbar">
                <input id="searchInput" type="search"
                       placeholder="Search products..." aria-label="Search products">

                <select id="categoryFilter" aria-label="Filter by category">
                    <option value="all">All categories</option>
                </select>
            </div>

            <p id="statusMessage" class="message" role="status" aria-live="polite">
                Ready to load products.
            </p>

            <p id="productCount"></p>

            <div id="productList" class="product-grid"></div>
        </section>

        <section id="productDetails" class="panel" hidden>
            <div class="details-heading">
                <h2>Product Details</h2>
                <button id="closeDetailsButton" type="button">Close</button>
            </div>

            <div id="detailsContent"></div>
        </section>
    </main>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
