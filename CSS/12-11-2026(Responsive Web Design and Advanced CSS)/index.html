<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Web Design - Day 3</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      padding: 30px 16px;
    }

    main {
      max-width: 850px;
      margin: auto;
    }

    h1 {
      margin-bottom: 12px;
    }

    p {
      line-height: 1.6;
      margin-bottom: 20px;
    }

    a {
      display: block;
      background: white;
      padding: 16px;
      margin: 12px 0;
      border-radius: 10px;
      color: #2563eb;
      text-decoration: none;
      box-shadow: 0 2px 8px #00000010;
    }

    a:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <main>
    <h1>Responsive Web Design and Advanced CSS</h1>
    <p>Day 3 learning workspace. Explore the concepts and complete the mini assignment.</p>
    <a href="./practice/index.html">Open CSS Practice</a>
    <a href="./mini-assignment/index.html">Open Responsive Employee Dashboard</a>
  </main>
</body>
</html>
