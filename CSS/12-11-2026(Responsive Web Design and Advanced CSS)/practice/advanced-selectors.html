<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Selectors</title>
  <link rel="stylesheet" href="advanced-selectors.css">
</head>
<body>
  <main class="container">
    <h1>Employee List</h1>

    <ul class="employee-list">
      <li class="active">Arun - Active</li>
      <li>Priya - Inactive</li>
      <li>Rahul - Active</li>
      <li>Divya - Inactive</li>
    </ul>

    <form>
      <input type="text" placeholder="Enter employee name" required>
      <label>
        <input type="checkbox">
        I agree
      </label>
      <button type="submit">Submit</button>
    </form>

    <article class="profile">
      <img src="https://images.unsplash.com/photo-1497366754035-f200968a6e72?w=300" alt="Office">
      <p>Profile card containing an image.</p>
    </article>
  </main>
</body>
</html>
