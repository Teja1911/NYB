<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Float and Clear</title>
    <link rel="stylesheet" href="./float-clear.css">
</head>
<body>
    <h1>Float and Clear</h1>

    <div class="container">
        <div class="image-box">Image</div>
        <p>
            This paragraph wraps around the floated box.
            Float moves an element to the left or right,
            allowing inline content to flow around it.
        </p>
    </div>

    <div class="clear-box">Content after clearing float</div>
</body>
</html>
