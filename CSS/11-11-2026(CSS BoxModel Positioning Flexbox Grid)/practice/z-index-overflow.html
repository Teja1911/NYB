<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Z-Index and Overflow</title>
    <link rel="stylesheet" href="./z-index-overflow.css">
</head>
<body>
    <h1>Z-Index Example</h1>

    <div class="parent">
        <div class="box-one">Z-Index 1</div>
        <div class="box-two">Z-Index 2</div>
    </div>

    <h2>Overflow Example</h2>

    <div class="overflow-box">
        This is a long paragraph used to demonstrate overflow.
        The content exceeds the available height of this box.
        Scroll to see the remaining content.
        This is additional content for testing.
    </div>
</body>
</html>
