<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Positioning</title>
    <link rel="stylesheet" href="./positioning.css">
</head>
<body>
    <h1>CSS Positioning</h1>

    <div class="static">Static Position</div>

    <div class="relative">
        Relative Parent
        <div class="absolute">Absolute Child</div>
    </div>

    <div class="sticky">Sticky Header</div>

    <p>Scroll down to observe sticky positioning.</p>
    <div class="space"></div>

    <button class="fixed">Fixed Button</button>
</body>
</html>
