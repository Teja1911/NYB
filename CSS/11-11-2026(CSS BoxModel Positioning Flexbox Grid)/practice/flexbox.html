<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flexbox Practice</title>
    <link rel="stylesheet" href="./flexbox.css">
</head>
<body>
    <h1>Flexbox Practice</h1>

    <h2>Flex Row</h2>
    <div class="container row">
        <div>One</div>
        <div>Two</div>
        <div>Three</div>
    </div>

    <h2>Flex Column</h2>
    <div class="container column">
        <div>One</div>
        <div>Two</div>
        <div>Three</div>
    </div>

    <h2>Flex Wrap</h2>
    <div class="container wrap">
        <div>One</div>
        <div>Two</div>
        <div>Three</div>
        <div>Four</div>
        <div>Five</div>
    </div>
</body>
</html>
