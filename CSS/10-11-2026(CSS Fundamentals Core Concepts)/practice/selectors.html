<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Selectors</title>
    <link rel="stylesheet" href="./selectors.css">
</head>
<body>
    <h1>CSS Selectors</h1>

    <h2>Element Selector</h2>

    <p>Paragraph using element selector.</p>

    <p class="highlight">Paragraph using class selector.</p>

    <p id="unique">Paragraph using ID selector.</p>

    <div class="parent">
        <p>Descendant selector</p>

        <section>
            <p>Nested paragraph</p>
        </section>
    </div>

    <div class="siblings">
        <h3>Heading</h3>
        <p>Adjacent sibling</p>
        <p>General sibling</p>
    </div>

    <input type="text" placeholder="Enter your name">
</body>
</html>
