<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Units</title>
    <link rel="stylesheet" href="./css-units.css">
</head>
<body>
    <h1>CSS Units</h1>

    <div class="pixel">Width: 200px</div>
    <div class="percentage">Width: 80%</div>
    <div class="em">Font size: 2em</div>
    <div class="rem">Font size: 2rem</div>
    <div class="viewport-width">Width: 50vw</div>
    <div class="viewport-height">Height: 20vh</div>
</body>
</html>
