<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Profile Card</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="profile-card">
        <div class="profile-banner"></div>

        <div class="profile-content">
            <img
                class="profile-image"
                src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=300"
                alt="Profile portrait"
            >

            <h1>Teja</h1>
            <h2>Frontend Developer</h2>

            <p class="description">
                Passionate developer interested in building responsive,
                user-friendly web applications using modern technologies.
            </p>

            <div class="skills">
                <h3>My Skills</h3>
                <span>HTML</span>
                <span>CSS</span>
                <span>JavaScript</span>
                <span>React</span>
            </div>

            <div class="profile-details">
                <p><strong>Location:</strong> Hyderabad</p>
                <p><strong>Experience:</strong> Frontend Development</p>
            </div>

            <a class="contact-btn" href="mailto:hello@example.com">
                Contact Me
            </a>

            <div class="social-links">
                <a href="https://github.com/" target="_blank" rel="noopener noreferrer">GitHub</a>
                <a href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
            </div>
        </div>
    </main>
</body>
</html>
