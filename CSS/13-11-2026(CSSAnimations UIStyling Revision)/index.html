<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animations and UI Styling - Day 4</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            padding: 30px 16px;
        }

        main {
            max-width: 850px;
            margin: auto;
        }

        h1 {
            margin-bottom: 12px;
        }

        p {
            line-height: 1.6;
            margin-bottom: 20px;
        }

        a {
            display: block;
            padding: 16px;
            margin: 12px 0;
            background: white;
            border-radius: 10px;
            color: #4f46e5;
            text-decoration: none;
            transition: transform 0.3s ease;
        }

        a:hover {
            transform: translateX(5px);
        }
    </style>
</head>
<body>
    <main>
        <h1>CSS Animations and UI Styling</h1>
        <p>Day 4: Complete CSS practical revision.</p>

        <a href="./practice/index.html">Open CSS Practice</a>
        <a href="./final-project/index.html">Open Final Portfolio Project</a>
    </main>
</body>
</html>
