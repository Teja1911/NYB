<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Buttons</title>
    <link rel="stylesheet" href="buttons.css">
</head>
<body>
    <main class="container">
        <h1>Button Components</h1>
