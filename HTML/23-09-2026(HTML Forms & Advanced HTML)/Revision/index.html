<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <figure>
        <img
            src="office.jpg"
            alt="NYBInfotech office building"
            width="500"
            height="400"
        >
        <figcaption>
            NYB Infotech headquarters in Hyderabad
        </figcaption>    
    </figure>
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3806.314466305348!2d78.38325139999999!3d17.4446566!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xa9403e6d6750337f%3A0x3be8f5af6f41a897!2sNYB%20Infotech!5e0!3m2!1sen!2sin!4v1790154484446!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <!-- HTML Form -->
    <!-- A form collects information from a user -->
    <fieldset>
        <legend>Employee Form:</legend>
        <form action="/apply" method="post">
            <label for="fullName">Full Name:</label>
            <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" maxlength="50"><br><br>
            <label for="mobile">Phone Number:</label>
            <input type="tel" name="phoneNumber" id="mobile" pattern="[0-9]{10}" required>
            <label for="emailAddress">Email:</label>
            <input type="email" name="email" id="emailAddress" placeholder="you@example.com" required><br><br>
            <label for="accountPassword">Password:</label>
            <input type="password" name="password" id="accountPassword" required><br><br>
            <label for="experienceYears">Experience:</label>
            <input type="number" name="years" id="experienceYears" min="0" max="50"><br><br>
            <label for="birthDate">Date of birth:</label>
            <input type="date" id="birthDate" name="birthDate"><br><br>
            <label for="resumeFile">Resume:</label>
            <input type="file" name="resume" id="resumeFile"><br>
            <p>Employement Type:</p>
            <input type="radio" id="fullTime" name="employeeType" value="fullTime">
            <label for="fullTime">Full Time</label>
            <input type="radio" name="employeeType" id="partTime" value="partTime">
            <label for="partTime">Part Time</label><br>
            <p>Skills:</p>
            <input type="checkbox" name="skills" id="html">
            <label for="html">HTML</label>
            <input type="checkbox" name="skills" id="css">
            <label for="css">CSS</label>
            <input type="checkbox" name="skills" id="js">
            <label for="js">JavaScript</label>
            <input type="checkbox" name="skills" id="react">
            <label for="react">React</label><br><br>
            <label for="location">Preferred Location:</label>
            <select name="location" id="location">
                <option value="location">Location</option>
                <option value="Hyd">Hyderabad</option>
                <option value="banglore">Banglore</option>
                <option value="chennai">Chennai</option>
                <option value="coimbatore">Coimbatore</option>
            </select><br><br>
            <label for="coverLetter">Cover Letter:</label>
            <textarea name="coverLetter" id="coverLetter" rows="6" cols="50" placeholder="Write your cover letter..."></textarea><br><br>
            <button type="submit">Submit</button>
            <button type="reset">Clear Form</button>
        </form>
    </fieldset><br>
    <details>
        <summary>
            What technologies do you know?
        </summary>
        <p>
            HTML, CSS, JavaScript and React.
        </p>
    </details>
    
</body>
</html>
